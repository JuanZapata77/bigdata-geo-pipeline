services:
  geo_mongo:
    image: mongo:6.0
    container_name: geo_mongo
    ports:
      - "27017:27017"
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: jenkins.Dockerfile
    container_name: jenkins
    user: root
    privileged: true
    ports:
      - "8080:8080" 
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  geo_api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: geo_api
    ports:
      - "8000:8000" 
    environment:
      - MONGO_URI=mongodb://geo_mongo:27017/
    depends_on:
      - geo_mongo
    restart: unless-stopped

  dask_scheduler:
    image: daskdev/dask:latest
    container_name: dask_scheduler
    command: dask-scheduler
    ports:
      - "8786:8786" 
      - "8787:8787" 
    restart: unless-stopped

  dask_worker_1:
    image: daskdev/dask:latest
    container_name: dask_worker_1
    command: dask-worker tcp://dask_scheduler:8786
    depends_on:
      - dask_scheduler
    restart: unless-stopped

  dask_worker_2:
    image: daskdev/dask:latest
    container_name: dask_worker_2
    command: dask-worker tcp://dask_scheduler:8786
    depends_on:
      - dask_scheduler
    restart: unless-stopped

  spark_master:
    image: bde2020/spark-master:3.2.1-hadoop3.2
    container_name: spark_master
    ports:
      - "7077:7077" 
      - "8082:8080" 
    restart: unless-stopped

  spark_worker:
    image: bde2020/spark-worker:3.2.1-hadoop3.2
    container_name: spark_worker
    environment:
      - "SPARK_MASTER=spark://spark_master:7077"
      - "SPARK_WORKER_CORES=2"
      - "SPARK_WORKER_MEMORY=2G"
    depends_on:
      - spark_master
    restart: unless-stopped

volumes:
  jenkins_home:
