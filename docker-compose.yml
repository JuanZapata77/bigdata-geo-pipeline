services:
  geo_mongo:
    image: mongo:latest
    container_name: geo_mongo
    ports:
      - "27017:27017"
    restart: unless-stopped

  geo_api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: geo_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - geo_mongo
      - dask_scheduler
      - spark_master
    restart: unless-stopped

  dask_scheduler:
    image: daskdev/dask:latest
    container_name: dask_scheduler
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    restart: unless-stopped

  dask_worker_1:
    image: daskdev/dask:latest
    container_name: dask_worker_1
    command: dask-worker tcp://dask_scheduler:8786
    volumes:
      - ./data:/app/data
    depends_on:
      - dask_scheduler
    restart: unless-stopped

  dask_worker_2:
    image: daskdev/dask:latest
    container_name: dask_worker_2
    command: dask-worker tcp://dask_scheduler:8786
    volumes:
      - ./data:/app/data
    depends_on:
      - dask_scheduler
    restart: unless-stopped

  spark_master:
    image: apache/spark:3.5.0
    container_name: spark_master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    restart: unless-stopped

  spark_worker:
    image: apache/spark:3.5.0
    container_name: spark_worker
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark_master:7077
    depends_on:
      - spark_master
    restart: unless-stopped